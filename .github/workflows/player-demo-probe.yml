name: Player demo Vercel smoke test

on:
  push:
    branches:
      - player-demo-vercel
    paths:
      - .github/workflows/player-demo-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect player page
        run: |
          URL="https://pstream-player-demo-aw2tzmy6j-atop5.vercel.app"
          code=$(curl -L -sS -o page.html -w '%{http_code}' "$URL/" || true)
          echo "homepage -> HTTP $code"
          echo "--- response preview ---"
          head -c 2500 page.html || true
          echo
          echo "--- end response preview ---"
          test "$code" = "200"

      - name: Inspect API function
        run: |
          URL="https://pstream-player-demo-aw2tzmy6j-atop5.vercel.app"
          code=$(curl -L -sS -o api.txt -w '%{http_code}' "$URL/api/stream?id=x" || true)
          echo "api -> HTTP $code"
          echo "--- api response ---"
          head -c 2500 api.txt || true
          echo
          echo "--- end api response ---"
