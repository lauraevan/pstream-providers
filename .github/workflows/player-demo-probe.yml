name: Player demo Vercel smoke test

on:
  push:
    branches:
      - player-demo-vercel
    paths:
      - .github/workflows/player-demo-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check player page
        run: |
          URL="https://pstream-player-demo-aw2tzmy6j-atop5.vercel.app"
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o page.html -w '%{http_code}' "$URL/" || true)
            echo "homepage attempt $i -> HTTP $code"
            if [ "$code" = "200" ] && grep -q "P-Stream Player Demo" page.html; then
              break
            fi
            sleep 10
          done
          test "$code" = "200"
          grep -q "P-Stream Player Demo" page.html

      - name: Check API function boots
        run: |
          URL="https://pstream-player-demo-aw2tzmy6j-atop5.vercel.app"
          code=$(curl -L -sS -o api.json -w '%{http_code}' "$URL/api/stream?id=x" || true)
          echo "api -> HTTP $code"
          cat api.json || true
          test "$code" = "400"
          grep -q "numeric TMDB" api.json
