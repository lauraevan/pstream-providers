name: Player demo Vercel smoke test

on:
  push:
    branches:
      - player-demo-vercel
    paths:
      - .github/workflows/player-demo-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify protection-disabled Vercel project
        run: |
          URL="https://pstream-public-probe-atop5.vercel.app"
          code=$(curl -sS -D headers.txt -o page.html -w '%{http_code}' "$URL/" || true)
          echo "HTTP $code"
          cat headers.txt
          cat page.html
          test "$code" = "200"
          grep -q "PUBLIC-PROBE-OK" page.html
          if grep -qi "vercel.com/sso-api" headers.txt; then
            echo "Still protected"
            exit 1
          fi
          echo "Protection-disabled production project is publicly reachable"
