name: Player demo Vercel smoke test

on:
  push:
    branches:
      - player-demo-vercel
    paths:
      - .github/workflows/player-demo-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Vercel redirect
        run: |
          URL="https://pstream-player-demo-aw2tzmy6j-atop5.vercel.app"
          code=$(curl -sS -D headers.txt -o body.html -w '%{http_code}' "$URL/" || true)
          echo "initial HTTP $code"
          echo "--- response headers ---"
          cat headers.txt
          echo "--- title / body markers ---"
          grep -oi '<title[^>]*>[^<]*</title>' body.html | head -3 || true
          grep -Eoi 'vercel[^<]{0,120}|authentication[^<]{0,120}|login[^<]{0,120}|deployment[^<]{0,120}' body.html | head -20 || true

      - name: Follow redirect and print final URL
        run: |
          URL="https://pstream-player-demo-aw2tzmy6j-atop5.vercel.app"
          curl -L -sS -o /dev/null -w 'final URL: %{url_effective}\nfinal HTTP: %{http_code}\n' "$URL/"
