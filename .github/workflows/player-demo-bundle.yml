name: Player demo bundle

on:
  push:
    branches:
      - player-demo-vercel
    paths-ignore:
      - player-demo/vendor/providers.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build provider package
        run: pnpm run build

      - name: Copy compiled provider bundle
        run: |
          mkdir -p player-demo/vendor
          cp lib/index.js player-demo/vendor/providers.js

      - name: Commit compiled provider bundle to demo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player-demo/vendor/providers.js
          if git diff --cached --quiet; then
            echo "Provider bundle already up to date"
          else
            git commit -m "build: update player demo provider bundle [skip ci]"
            git push
          fi

      - name: Upload compiled provider library
        uses: actions/upload-artifact@v4
        with:
          name: pstream-provider-lib
          path: lib/
          if-no-files-found: error
          retention-days: 1
